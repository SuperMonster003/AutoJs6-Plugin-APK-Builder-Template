name: Repository and Runtime Kit source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Check repository and generated documentation
        run: |
          python .python/check_repository.py
          python .python/generate_markdown.py --check
          python -m unittest discover -s .python -p 'test_*.py'
          python -m unittest discover -s scripts/tests -p 'test_*.py'
      # runtime-kit/ contains ignored, externally produced artifacts.
      # Android builds, Binder execution and native checks run in build-from-runtime-kit.yml
      # only after its complete source-bound Runtime Kit matrix has passed validation.
