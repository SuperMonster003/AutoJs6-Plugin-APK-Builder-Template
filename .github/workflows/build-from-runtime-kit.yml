name: Build APK Builder Template Plugin from Runtime Kit

on:
  repository_dispatch:
    types:
      - autojs6_runtime_kit_released
  workflow_dispatch:
    inputs:
      tag:
        description: AutoJs6 release tag, for example v6.8.0
        required: true
      source_repo:
        description: AutoJs6 source repository
        required: false
        default: SuperMonster003/AutoJs6

permissions:
  contents: write

# Releases are serialized: PLUGIN_RELEASE_SEQ / compat-matrix.json advance per run
# and must not race between concurrent workflow runs.
concurrency:
  group: build-from-runtime-kit
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Resolve build inputs
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "tag=${{ github.event.client_payload.tag }}" >> "$GITHUB_OUTPUT"
            echo "source_repo=${{ github.event.client_payload.source_repo }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "source_repo=${{ inputs.source_repo }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Runtime Kit
        env:
          GH_TOKEN: ${{ secrets.AUTOJS6_MAIN_REPO_TOKEN || github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          archive_dir="$RUNNER_TEMP/autojs6-runtime-kit-download"
          runtime_kits_dir="$RUNNER_TEMP/autojs6-runtime-kits"
          rm -rf "$archive_dir" "$runtime_kits_dir"
          mkdir -p "$archive_dir" "$runtime_kits_dir"

          gh release download "${{ steps.vars.outputs.tag }}" \
            --repo "${{ steps.vars.outputs.source_repo }}" \
            --pattern "autojs6-runtime-kit-*.zip" \
            --dir "$archive_dir"

          archives=("$archive_dir"/autojs6-runtime-kit-*.zip)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No Runtime Kit archives were downloaded." >&2
            exit 1
          fi

          for archive in "${archives[@]}"; do
            archive_name="$(basename "${archive%.zip}")"
            target_dir="$runtime_kits_dir/$archive_name"
            mkdir -p "$target_dir"
            unzip -q "$archive" -d "$target_dir"
          done
          rm -rf "$archive_dir"
          echo "RUNTIME_KITS_DIR=$runtime_kits_dir" >> "$GITHUB_ENV"

      - name: Verify Runtime Kit variant set
        run: |
          set -euo pipefail
          shopt -s nullglob
          kit_dirs=("$RUNTIME_KITS_DIR"/*)
          for kit_dir in "${kit_dirs[@]}"; do
            python3 scripts/verify_runtime_kit.py "$kit_dir"
          done

          manifest="$RUNNER_TEMP/autojs6-runtime-kit-variants.json"
          python3 scripts/verify_runtime_kit_set.py "$RUNTIME_KITS_DIR" --output "$manifest"
          universal_kit="$(
            python3 - "$manifest" <<'PY'
          import json
          import sys

          manifest = json.load(open(sys.argv[1], encoding="utf-8"))
          print(next(item["runtimeKitDir"] for item in manifest["variants"] if item["variant"] == "inrt-universal"))
          PY
          )"
          test -n "$universal_kit"
          echo "RUNTIME_KIT_VARIANTS_MANIFEST=$manifest" >> "$GITHUB_ENV"
          echo "UNIVERSAL_RUNTIME_KIT_DIR=$universal_kit" >> "$GITHUB_ENV"

      - name: Sync plugin version
        run: python3 scripts/sync_version_from_runtime_kit.py "$UNIVERSAL_RUNTIME_KIT_DIR"

      - name: Prepare release signing keystore
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          required=(SIGNING_KEY_BASE64 SIGNING_KEY_STORE_PASSWORD SIGNING_KEY_ALIAS SIGNING_KEY_PASSWORD SIGNING_CERT_SHA256)
          for name in "${required[@]}"; do
            test -n "${!name-}" || { echo "Missing required Actions secret: $name" >&2; exit 1; }
          done
          umask 077
          keystore="$RUNNER_TEMP/autojs6-release-signing.jks"
          printf '%s' "$SIGNING_KEY_BASE64" | tr -d '\r\n' | base64 --decode > "$keystore"
          test -s "$keystore"
          keytool -list -keystore "$keystore" -storepass:env SIGNING_KEY_STORE_PASSWORD -alias "$SIGNING_KEY_ALIAS" >/dev/null
          echo "SIGNING_KEY_STORE_FILE=$keystore" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed plugin APK variants
        env:
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apk_dir="$RUNNER_TEMP/autojs6-plugin-apks"
          rm -rf "$apk_dir"
          mkdir -p "$apk_dir"

          while IFS=$'\t' read -r variant kit_dir; do
            echo "Building $variant from $kit_dir"
            rm -rf app/build/outputs/apk/release
            ./gradlew :app:assembleRelease \
              "-Pautojs.apkBuilder.templatePlugin.runtimeKitDir=$kit_dir"
            outputs=(app/build/outputs/apk/release/*.apk)
            if [ "${#outputs[@]}" -ne 1 ]; then
              printf 'Expected one APK for %s, found %d.\n' "$variant" "${#outputs[@]}" >&2
              exit 1
            fi
            cp "${outputs[0]}" "$apk_dir/"
          done < <(
            python3 - "$RUNTIME_KIT_VARIANTS_MANIFEST" <<'PY'
          import json
          import sys

          for item in json.load(open(sys.argv[1], encoding="utf-8"))["variants"]:
              print(f'{item["variant"]}\t{item["runtimeKitDir"]}')
          PY
          )

          expected_count="$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["variants"]))' "$RUNTIME_KIT_VARIANTS_MANIFEST")"
          staged=("$apk_dir"/*.apk)
          test "${#staged[@]}" -eq "$expected_count"
          echo "PLUGIN_APK_DIR=$apk_dir" >> "$GITHUB_ENV"

      - name: Verify release APK signatures and add CRC32 suffixes
        env:
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=("$PLUGIN_APK_DIR"/*.apk)
          test "${#apks[@]}" -gt 0
          apksigner="$(command -v apksigner || true)"
          if [ -z "$apksigner" ]; then
            apksigner="$(find "${ANDROID_HOME:?}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          fi
          test -x "$apksigner"
          aapt="$(dirname "$apksigner")/aapt"
          test -x "$aapt"
          expected_sha256="$(printf '%s' "$SIGNING_CERT_SHA256" | tr '[:upper:]' '[:lower:]' | tr -d ':[:space:]')"
          plugin_version="$(sed -n 's/^PLUGIN_VERSION_NAME=//p' version.properties | head -n 1)"
          plugin_seq="$(sed -n 's/^PLUGIN_RELEASE_SEQ=//p' version.properties | head -n 1)"
          host_version="$(sed -n 's/^VERSION_NAME=//p' version.properties | head -n 1)"
          host_code="$(sed -n 's/^VERSION_BUILD=//p' version.properties | head -n 1)"
          host_slug="$(printf '%s' "$host_version" | tr '[:upper:] ' '[:lower:]-')"
          expected_version_code="$((host_code * 100 + plugin_seq))"
          expected_version_name="${plugin_version}+autojs6-${host_slug}"
          for apk in "${apks[@]}"; do
            verification="$($apksigner verify --verbose --print-certs "$apk")"
            printf '%s\n' "$verification"
            actual_sha256="$(
              printf '%s\n' "$verification" \
                | grep -E 'certificate SHA-256 digest:' \
                | head -n 1 \
                | sed 's/.*digest: //' \
                | tr '[:upper:]' '[:lower:]' \
                | tr -d ':[:space:]'
            )"
            echo "Expected signer certificate SHA-256: $expected_sha256"
            echo "Actual signer certificate SHA-256:   $actual_sha256"
            test "$actual_sha256" = "$expected_sha256"

            badging="$("$aapt" dump badging "$apk" | head -n 1)"
            printf '%s\n' "$badging"
            grep -F "versionCode='$expected_version_code'" <<< "$badging"
            grep -F "versionName='$expected_version_name'" <<< "$badging"

            crc32="$(
              python3 - "$apk" <<'PY'
          import sys
          import zlib
          from pathlib import Path

          digest = 0
          with Path(sys.argv[1]).open("rb") as stream:
              while chunk := stream.read(4096):
                  digest = zlib.crc32(chunk, digest)
          print(f"{digest & 0xffffffff:08x}")
          PY
            )"
            apk_with_crc="${apk%.apk}-$crc32.apk"
            mv "$apk" "$apk_with_crc"
            echo "$(basename "$apk_with_crc"): CRC32=$crc32"
          done

      - name: Verify plugin APK variant assets
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=("$PLUGIN_APK_DIR"/*.apk)
          for apk in "${apks[@]}"; do
            python3 scripts/check_apk_assets.py --plugin-apk "$apk"

            embedded_archives="$(
              unzip -Z1 "$apk" \
                | grep -E '^assets/runtime-kit/(.*/)?autojs6-runtime-kit-.*\.zip$' \
                || true
            )"
            if [ -n "$embedded_archives" ]; then
              echo "Plugin APK contains an unexpected embedded Runtime Kit archive: $apk" >&2
              printf '  %s\n' "$embedded_archives" >&2
              exit 1
            fi
          done

      - name: Create release evidence manifest
        env:
          SIGNING_CERT_SHA256: ${{ secrets.SIGNING_CERT_SHA256 }}
        run: |
          set -euo pipefail
          plugin_version="$(sed -n 's/^PLUGIN_VERSION_NAME=//p' version.properties | head -n 1)"
          plugin_seq="$(sed -n 's/^PLUGIN_RELEASE_SEQ=//p' version.properties | head -n 1)"
          host_version="$(sed -n 's/^VERSION_NAME=//p' version.properties | head -n 1)"
          host_code="$(sed -n 's/^VERSION_BUILD=//p' version.properties | head -n 1)"
          host_slug="$(printf '%s' "$host_version" | tr '[:upper:] ' '[:lower:]-')"
          plugin_version_code="$((host_code * 100 + plugin_seq))"
          evidence_file="$RUNNER_TEMP/autojs6-apk-builder-template-v${plugin_version}-autojs6-v${host_slug}-vc${plugin_version_code}-release-evidence.json"
          released_at="$(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          python3 scripts/create_release_evidence.py \
            --runtime-kits-manifest "$RUNTIME_KIT_VARIANTS_MANIFEST" \
            --version-properties version.properties \
            --apk-dir "$PLUGIN_APK_DIR" \
            --repository "$GITHUB_REPOSITORY" \
            --release-tag "${{ steps.vars.outputs.tag }}" \
            --source-repository "${{ steps.vars.outputs.source_repo }}" \
            --source-tag "${{ steps.vars.outputs.tag }}" \
            --signer-certificate-sha256 "$SIGNING_CERT_SHA256" \
            --released-at "$released_at" \
            --output "$evidence_file"

          echo "RELEASED_AT=$released_at" >> "$GITHUB_ENV"
          echo "RELEASE_EVIDENCE_FILE=$evidence_file" >> "$GITHUB_ENV"

      - name: Preserve release evidence as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-builder-template-release-evidence
          path: ${{ env.RELEASE_EVIDENCE_FILE }}
          if-no-files-found: error

      - name: Remove release signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/autojs6-release-signing.jks"

      - name: Publish plugin release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.vars.outputs.tag }}"
          release_version="${tag#v}"
          release_version="${release_version#V}"
          release_date="$(TZ=Asia/Shanghai date '+%Y/%m/%d')"
          release_title="$release_version @ $release_date"

          plugin_version="$(sed -n 's/^PLUGIN_VERSION_NAME=//p' version.properties | head -n 1)"
          plugin_build="$(sed -n 's/^PLUGIN_VERSION_BUILD=//p' version.properties | head -n 1)"
          plugin_seq="$(sed -n 's/^PLUGIN_RELEASE_SEQ=//p' version.properties | head -n 1)"
          host_version="$(sed -n 's/^VERSION_NAME=//p' version.properties | head -n 1)"
          host_code="$(sed -n 's/^VERSION_BUILD=//p' version.properties | head -n 1)"
          plugin_version_code="$((host_code * 100 + plugin_seq))"
          release_notes="$(cat <<EOF
          APK Builder Template v$plugin_version built from AutoJs6 Runtime Kit $tag.

          - Plugin: $plugin_version (build $plugin_build, Android versionCode $plugin_version_code)
          - Paired host: AutoJs6 $host_version (versionCode $host_code)
          - Assets: universal + arm64-v8a + armeabi-v7a + x86_64 + x86
          - Remote build: experimental and disabled by default
          - Evidence: $(basename "$RELEASE_EVIDENCE_FILE")

          The APK includes the 10-language changelog and usage documentation.
          EOF
          )"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$release_title" --notes "$release_notes"
          else
            gh release create "$tag" --title "$release_title" --notes "$release_notes"
          fi
          shopt -s nullglob
          apks=("$PLUGIN_APK_DIR"/*.apk)
          for apk in "${apks[@]}"; do
            legacy_asset_name="$(basename "$apk" | sed -E 's/-[0-9a-f]{8}\.apk$/.apk/')"
            gh release delete-asset "$tag" "$legacy_asset_name" --yes >/dev/null 2>&1 || true
          done
          gh release upload "$tag" "${apks[@]}" "$RELEASE_EVIDENCE_FILE" --clobber

      - name: Persist released plugin version and compat matrix
        env:
          RELEASE_TAG: ${{ steps.vars.outputs.tag }}
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          git fetch --no-tags origin \
            "+refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"
          python3 scripts/sync_version_from_runtime_kit.py "$UNIVERSAL_RUNTIME_KIT_DIR"

          released_at="${RELEASED_AT:?Release evidence timestamp was not recorded}"
          while IFS=$'\t' read -r variant slug kit_dir; do
            matches=("$PLUGIN_APK_DIR"/*-"$slug"-????????.apk)
            if [ "${#matches[@]}" -ne 1 ]; then
              printf 'Expected one staged APK for %s, found %d.\n' "$variant" "${#matches[@]}" >&2
              exit 1
            fi
            apk="${matches[0]}"
            python3 scripts/update_compat_matrix.py add \
              --matrix compat-matrix.json \
              --runtime-kit "$kit_dir" \
              --version-properties version.properties \
              --apk "$apk" \
              --apk-name "$(basename "$apk")" \
              --tag "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --released-at "$released_at"
          done < <(
            python3 - "$RUNTIME_KIT_VARIANTS_MANIFEST" <<'PY'
          import json
          import sys

          for item in json.load(open(sys.argv[1], encoding="utf-8"))["variants"]:
              print(f'{item["variant"]}\t{item["slug"]}\t{item["runtimeKitDir"]}')
          PY
          )

          version_build="$(sed -n 's/^VERSION_BUILD=//p' version.properties | head -n 1)"
          version_name="$(sed -n 's/^VERSION_NAME=//p' version.properties | head -n 1)"
          plugin_version="$(sed -n 's/^PLUGIN_VERSION_NAME=//p' version.properties | head -n 1)"
          plugin_build="$(sed -n 's/^PLUGIN_VERSION_BUILD=//p' version.properties | head -n 1)"
          plugin_seq="$(sed -n 's/^PLUGIN_RELEASE_SEQ=//p' version.properties | head -n 1)"
          test -n "$version_build"
          test -n "$version_name"
          test -n "$plugin_version"
          test -n "$plugin_build"
          test -n "$plugin_seq"

          git add version.properties compat-matrix.json
          if git diff --cached --quiet; then
            echo "version.properties and compat-matrix.json already match release $RELEASE_TAG."
            exit 0
          fi

          git diff --cached --check
          git diff --cached -- version.properties compat-matrix.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: sync plugin version and compat matrix for $RELEASE_TAG"
          git push origin "HEAD:$TARGET_BRANCH"

          echo "Persisted VERSION_BUILD=$version_build"
          echo "Persisted VERSION_NAME=$version_name"
          echo "Persisted PLUGIN_VERSION_NAME=$plugin_version"
          echo "Persisted PLUGIN_VERSION_BUILD=$plugin_build"
          echo "Persisted PLUGIN_RELEASE_SEQ=$plugin_seq"
